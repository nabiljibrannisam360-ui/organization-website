<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Data</title>
    <link rel="stylesheet" href="stylelogin.css">
</head>
<body>

<div class="form-container">
    <h2>Formulir Pengisian Data</h2>
    <p class="subtitle">Silakan isi data dengan benar</p>

    <form action="#" method="post">
        <div class="field">
            <label>Nama Lengkap</label>
            <input type="text" placeholder="Masukkan nama lengkap" required>
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" placeholder="contoh@email.com" required>
        </div>

        <div class="field">
            <label>Nomor Telepon</label>
            <input type="tel" placeholder="08xxxxxxxxxx" required>
        </div>

        <div class="field">
            <label>Jenis Kelamin</label>
            <select required>
                <option value="">-- Pilih --</option>
                <option>Laki-laki</option>
                <option>Perempuan</option>
            </select>
        </div>

        <div class="field">
            <label>Alamat</label>
            <textarea rows="3" placeholder="Masukkan alamat lengkap"></textarea>
        </div>

        <div class="field">
            <label>Alasan mengikuti paskib</label>
            <textarea rows="3" placeholder="Masukkan jawaban"></textarea>
        </div>
    </form>
        <a href="sukses.html"><button type="submit">Kirim Data</button></a>
   
</div>

</body>
</html>
